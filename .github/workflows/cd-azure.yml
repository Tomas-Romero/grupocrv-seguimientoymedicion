name: CD (Azure)

# Entrega continua (T-017): construye la imagen Docker del servidor y, si el repositorio tiene
# configuradas las credenciales de Azure, la publica en el Azure Container Registry como
#   <ACR_NAME>.azurecr.io/<IMAGE_NAME>:<sha del commit>   y   :latest
#
# Configuracion (Settings > Secrets and variables > Actions; ver docs/ci-cd.md):
#   secreto   AZURE_CREDENTIALS  el JSON del service principal que entrega la catedra
#   variable  ACR_NAME           nombre del registro, sin ".azurecr.io"
#   variable  IMAGE_NAME         nombre de la imagen dentro del registro
#
# Si falta alguno, el workflow construye la imagen igual (valida el Dockerfile) pero no se
# loguea ni publica nada, asi que el repositorio no se pone en rojo antes de tener las credenciales.
#
# Seguridad: las acciones de terceros estan fijadas por el hash exacto de su version (si alguien
# moviera la etiqueta, el workflow seguiria usando el codigo que se reviso), el token no puede
# escribir en el repositorio y el JSON solo se pasa a azure/login, nunca a un comando ni al log.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Una publicacion en curso no se corta: la siguiente espera.
concurrency:
  group: cd-azure
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # 1. Configuracion: dice si hay con que publicar.
  # ---------------------------------------------------------------
  configuracion:
    name: Configuracion
    runs-on: ubuntu-latest
    outputs:
      completa: ${{ steps.revisar.outputs.completa }}
    steps:
      - name: Revisar secretos y variables
        id: revisar
        env:
          # Solo se pasa si el secreto existe, nunca su valor.
          TIENE_CREDENCIALES: ${{ secrets.AZURE_CREDENTIALS != '' }}
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          faltan=""
          [ "$TIENE_CREDENCIALES" = "true" ] || faltan="$faltan AZURE_CREDENTIALS(secreto)"
          [ -n "$ACR_NAME" ] || faltan="$faltan ACR_NAME(variable)"
          [ -n "$IMAGE_NAME" ] || faltan="$faltan IMAGE_NAME(variable)"
          if [ -z "$faltan" ]; then
            echo "completa=true" >> "$GITHUB_OUTPUT"
          else
            echo "completa=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CD sin configurar::Falta configurar:$faltan. Se construye la imagen para validar el Dockerfile, pero no se publica."
          fi

  # ---------------------------------------------------------------
  # 2. Imagen: la construye siempre y la publica solo si esta todo configurado.
  # ---------------------------------------------------------------
  imagen:
    name: Imagen Docker
    needs: configuracion
    runs-on: ubuntu-latest
    env:
      PUBLICAR: ${{ needs.configuracion.outputs.completa }}
      # Sin configuracion se usan nombres de relleno: la imagen no sale de este runner.
      REGISTRO: ${{ vars.ACR_NAME || 'sin-registro' }}.azurecr.io
      IMAGEN: ${{ vars.IMAGE_NAME || 'metrics' }}
    steps:
      - uses: actions/checkout@v4

      # azure/login v3.1.0
      - name: Login en Azure
        if: env.PUBLICAR == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login en el registro (ACR)
        if: env.PUBLICAR == 'true'
        run: az acr login --name "${{ vars.ACR_NAME }}"

      # docker/setup-buildx-action v4.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # docker/metadata-action v6.2.0: etiquetas de la imagen y metadatos OCI (commit, repositorio, fecha)
      - name: Nombre y etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRO }}/${{ env.IMAGEN }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # docker/build-push-action v7.4.0
      - name: Construir${{ env.PUBLICAR == 'true' && ' y publicar' || '' }} la imagen
        id: construir
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLICAR == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen
        run: |
          {
            echo "### Imagen Docker"
            echo ""
            if [ "$PUBLICAR" = "true" ]; then
              echo "Publicada en \`${REGISTRO}/${IMAGEN}\`"
              echo ""
              echo "- digest: \`${{ steps.construir.outputs.digest }}\`"
              echo "- etiquetas:"
              echo '${{ steps.meta.outputs.tags }}' | sed 's/^/  - `/; s/$/`/'
            else
              echo "Construida y validada, **sin publicar**: falta configurar \`AZURE_CREDENTIALS\`, \`ACR_NAME\` o \`IMAGE_NAME\` (ver docs/ci-cd.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
