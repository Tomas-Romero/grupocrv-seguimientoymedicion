name: CD (Azure)

# Entrega continua (T-017 y T-018): en cada merge a main construye la imagen Docker del servidor,
# la publica en el Azure Container Registry compartido de la catedra y la despliega en Azure
# Container Instances (ACI), que es lo que pidio la catedra:
#   <ACR_NAME>.azurecr.io/<IMAGE_NAME>:sha-<commit>   y   :latest
#
# Configuracion (ver docs/ci-cd.md). Los secretos viven en el Environment "azure", que solo puede
# usarse desde la rama main: asi nadie los puede leer desde una rama propia.
#   secreto   AZURE_CREDENTIALS  el JSON del service principal que entrega la catedra
#   secreto   DATABASE_URL       la cadena de conexion de la base (Neon), sin channel_binding
#   secreto   ACR_PASSWORD       la clave del registro que entrega la catedra: ACI la usa para bajar la imagen
# Las variables son opcionales (Settings > Secrets and variables > Actions > Variables); si no
# existen se usan los datos del grupo 03. Se aceptan tambien los nombres que usa la catedra (entre parentesis):
#   ACR_NAME              ingcalidad2026   (registro compartido: nunca se crea ni se borra desde aca)
#   ACR_URL               <ACR_NAME>.azurecr.io
#   IMAGE_NAME            grupo03-grupocrv
#   RESOURCE_GROUP        frsrutn          (AZURE_RESOURCE_GROUP)
#   CONTAINER_APP_NAME    grupo03-grupocrv-seguimientoymedicion   (nombre del grupo de contenedores; 63 caracteres como maximo)
#   ACI_DNS_LABEL         igual al nombre  (da la URL http://<etiqueta>.<region>.azurecontainer.io:8080)
#   ACI_CPU / ACI_MEMORIA 1 / 1            (ACI cobra el vCPU redondeado hacia arriba: menos de 1 no ahorra)
#   CARGAR_DATOS_EJEMPLO  true: carga el proyecto de ejemplo al arrancar (para la demo)
#   MANTENER_ENCENDIDO    false: despues de desplegar y comprobar /health, el contenedor SE APAGA (ACI cobra mientras
#                         esta encendido y no escala a cero). true solo mientras se necesite la app encendida
#   CD_ACTIVO             interruptor general de costos: SOLO con `true` se publica y se despliega. Sin la variable (o con
#                         cualquier otro valor) el workflow solo valida el Dockerfile, aunque esten todos los secretos
#
# Si falta algun secreto, el workflow construye la imagen igual (valida el Dockerfile) pero no se
# loguea, publica ni despliega nada, asi que el repositorio no se pone en rojo antes de tener las
# credenciales.
#
# Costos: la cuenta de Azure es compartida y con creditos limitados. ACI cobra por segundo MIENTRAS EL CONTENEDOR
# ESTA ENCENDIDO (no escala a cero): por eso, salvo MANTENER_ENCENDIDO=true, este workflow lo apaga despues de
# comprobar que responde, y aci-energia.yml lo enciende, lo apaga o lo apaga solo cada noche. Solo se conservan las
# ultimas etiquetas de la imagen del grupo en el registro.
#
# Seguridad: las acciones de terceros estan fijadas por el hash exacto de su version, el token no
# puede escribir en el repositorio, los secretos llegan a los comandos por variables de entorno y
# nunca escritos dentro del script, y todo lo que se crea, cambia o borra lleva el prefijo grupo03.

on:
  push:
    branches: [main]
    # Un cambio que no entra en la imagen no vuelve a construirla ni a desplegarla.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "specs/**"
      - "features/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:

permissions:
  contents: read

# Un despliegue en curso no se corta: el siguiente espera.
concurrency:
  group: cd-azure
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------
  # 1. Configuracion: dice si hay con que publicar y desplegar.
  # ---------------------------------------------------------------
  configuracion:
    name: Configuracion
    runs-on: ubuntu-latest
    # Los secretos son del Environment: sin esta linea el job no los ve.
    environment: azure
    outputs:
      completa: ${{ steps.revisar.outputs.completa }}
    steps:
      - name: Revisar secretos
        id: revisar
        env:
          # Solo se pasa si el secreto existe, nunca su valor.
          TIENE_CREDENCIALES: ${{ secrets.AZURE_CREDENTIALS != '' }}
          TIENE_BASE: ${{ secrets.DATABASE_URL != '' }}
          TIENE_CLAVE_ACR: ${{ secrets.ACR_PASSWORD != '' }}
          CD_ACTIVO: ${{ vars.CD_ACTIVO || 'false' }}
        run: |
          if [ "$CD_ACTIVO" != "true" ]; then
            echo "completa=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CD apagado::La variable CD_ACTIVO no vale true: se construye la imagen para validar el Dockerfile, pero no se publica ni se despliega."
            exit 0
          fi
          faltan=""
          [ "$TIENE_CREDENCIALES" = "true" ] || faltan="$faltan AZURE_CREDENTIALS"
          [ "$TIENE_BASE" = "true" ] || faltan="$faltan DATABASE_URL"
          [ "$TIENE_CLAVE_ACR" = "true" ] || faltan="$faltan ACR_PASSWORD"
          if [ -z "$faltan" ]; then
            echo "completa=true" >> "$GITHUB_OUTPUT"
          else
            echo "completa=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=CD sin configurar::Faltan los secretos:$faltan (Environment azure). Se construye la imagen para validar el Dockerfile, pero no se publica ni se despliega."
          fi

  # ---------------------------------------------------------------
  # 2. Imagen: la construye siempre y la publica solo si esta todo configurado.
  # ---------------------------------------------------------------
  imagen:
    name: Imagen Docker
    needs: configuracion
    runs-on: ubuntu-latest
    environment: azure
    env:
      PUBLICAR: ${{ needs.configuracion.outputs.completa }}
      ACR_NAME: ${{ vars.ACR_NAME || 'ingcalidad2026' }}
      REGISTRO: ${{ vars.ACR_URL || format('{0}.azurecr.io', vars.ACR_NAME || 'ingcalidad2026') }}
      ACR_USUARIO: ${{ vars.ACR_USERNAME || vars.ACR_NAME || 'ingcalidad2026' }}
      IMAGEN: ${{ vars.IMAGE_NAME || 'grupo03-grupocrv' }}
    steps:
      - uses: actions/checkout@v4

      # azure/login v3.1.0
      - name: Login en Azure
        if: env.PUBLICAR == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Con ACR_PASSWORD (la clave del registro que entrega la catedra) se entra con usuario y clave: no depende de
      # que el service principal tenga el rol AcrPush. Sin ella, se entra con el service principal.
      - name: Login en el registro (ACR)
        if: env.PUBLICAR == 'true'
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$ACR_PASSWORD" ]; then
            echo "Login en $REGISTRO con el usuario y la clave del registro"
            printf '%s' "$ACR_PASSWORD" | docker login "$REGISTRO" --username "$ACR_USUARIO" --password-stdin
          else
            echo "Login en $REGISTRO con el service principal"
            az acr login --name "$ACR_NAME"
          fi

      # docker/setup-buildx-action v4.4.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # docker/metadata-action v6.2.0: etiquetas de la imagen y metadatos OCI (commit, repositorio, fecha)
      - name: Nombre y etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRO }}/${{ env.IMAGEN }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # docker/build-push-action v7.4.0
      - name: Construir${{ env.PUBLICAR == 'true' && ' y publicar' || '' }} la imagen
        id: construir
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ env.PUBLICAR == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El registro es compartido por todos los grupos y cobra por almacenamiento: se conservan solo las
      # ultimas etiquetas sha-<commit> de la imagen del grupo. Nunca se toca otra imagen, ni `latest`, ni
      # el registro. Si falla no corta el despliegue.
      - name: Limpiar etiquetas viejas de la imagen del grupo
        if: env.PUBLICAR == 'true'
        continue-on-error: true
        env:
          CONSERVAR: "10"
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          auth=()
          if [ -n "$ACR_PASSWORD" ]; then auth=(--username "$ACR_USUARIO" --password "$ACR_PASSWORD"); fi
          case "$IMAGEN" in
            grupo03-*) ;;
            *)
              echo "::warning::La imagen $IMAGEN no empieza con grupo03-: no se borra ninguna etiqueta."
              exit 0
              ;;
          esac
          az acr repository show-tags --name "$ACR_NAME" --repository "$IMAGEN" --orderby time_desc --output tsv "${auth[@]}" \
            | { grep -E '^sha-[0-9a-f]{40}$' || true; } \
            | tail -n +"$((CONSERVAR + 1))" \
            | while IFS= read -r etiqueta; do
                echo "Borro ${IMAGEN}:${etiqueta}"
                az acr repository delete --name "$ACR_NAME" --image "${IMAGEN}:${etiqueta}" --yes "${auth[@]}"
              done

      # Los resultados de otros pasos llegan por variables de entorno y no escritos dentro del script:
      # asi el shell nunca interpreta su contenido (y shellcheck no tiene nada que objetar).
      - name: Resumen
        env:
          DIGEST: ${{ steps.construir.outputs.digest }}
          ETIQUETAS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Imagen Docker"
            echo ""
            if [ "$PUBLICAR" = "true" ]; then
              echo "Publicada en \`${REGISTRO}/${IMAGEN}\`"
              echo ""
              echo "- digest: \`${DIGEST}\`"
              echo "- etiquetas:"
              while IFS= read -r etiqueta; do
                echo "  - \`${etiqueta}\`"
              done <<< "$ETIQUETAS"
            else
              echo "Construida y validada, **sin publicar**: falta algun secreto (\`AZURE_CREDENTIALS\`, \`DATABASE_URL\`, \`ACR_PASSWORD\`) del Environment azure o la variable \`CD_ACTIVO\` no vale \`true\` (ver docs/ci-cd.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------
  # 3. Despliegue: reemplaza el contenedor del grupo en ACI con la imagen recien publicada, comprueba que responde y,
  #    salvo que se pida mantenerlo, lo apaga para no gastar creditos.
  # ---------------------------------------------------------------
  desplegar:
    name: Desplegar en Container Instances (ACI)
    needs: [configuracion, imagen]
    if: needs.configuracion.outputs.completa == 'true'
    runs-on: ubuntu-latest
    environment: azure
    env:
      REGISTRO: ${{ vars.ACR_URL || format('{0}.azurecr.io', vars.ACR_NAME || 'ingcalidad2026') }}
      ACR_USUARIO: ${{ vars.ACR_USERNAME || vars.ACR_NAME || 'ingcalidad2026' }}
      IMAGEN: ${{ vars.IMAGE_NAME || 'grupo03-grupocrv' }}
      GRUPO_RECURSOS: ${{ vars.RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP || 'frsrutn' }}
      CONTENEDOR: ${{ vars.CONTAINER_APP_NAME || vars.ACI_NAME || 'grupo03-grupocrv-seguimientoymedicion' }}
      ETIQUETA_DNS: ${{ vars.ACI_DNS_LABEL || vars.CONTAINER_APP_NAME || vars.ACI_NAME || 'grupo03-grupocrv-seguimientoymedicion' }}
      CARGAR_DATOS_EJEMPLO: ${{ vars.CARGAR_DATOS_EJEMPLO || 'true' }}
      CPU: ${{ vars.ACI_CPU || '1' }}
      MEMORIA: ${{ vars.ACI_MEMORIA || '1' }}
      MANTENER_ENCENDIDO: ${{ vars.MANTENER_ENCENDIDO || 'false' }}
    steps:
      # azure/login v3.1.0
      - name: Login en Azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar el contenedor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail
          # Sin esto, un nombre mal armado podria tocar recursos de otro grupo en la cuenta compartida.
          case "$CONTENEDOR" in
            grupo03-*) ;;
            *)
              echo "::error::El contenedor $CONTENEDOR no empieza con grupo03-: no se despliega."
              exit 1
              ;;
          esac
          # ACI acepta nombres de 1 a 63 caracteres, con minusculas, numeros y guiones (sin guion al principio ni al final);
          # la etiqueta DNS, de 5 a 63.
          if [ "${#CONTENEDOR}" -gt 63 ] || ! [[ "$CONTENEDOR" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "::error::El nombre del contenedor ($CONTENEDOR, ${#CONTENEDOR} caracteres) no es valido en ACI: 63 caracteres como maximo, minusculas, numeros y guiones."
            exit 1
          fi
          if [ "${#ETIQUETA_DNS}" -lt 5 ] || [ "${#ETIQUETA_DNS}" -gt 63 ] || ! [[ "$ETIQUETA_DNS" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            echo "::error::La etiqueta DNS ($ETIQUETA_DNS) no es valida: de 5 a 63 caracteres, minusculas, numeros y guiones."
            exit 1
          fi
          if ! [[ "$CPU" =~ ^[1-4]$ ]] || ! [[ "$MEMORIA" =~ ^[0-9]+(\.[0-9])?$ ]]; then
            echo "::error::ACI_CPU (1 a 4) o ACI_MEMORIA (en GB, por ejemplo 1 o 1.5) no son validos: $CPU / $MEMORIA."
            exit 1
          fi

          imagen_completa="${REGISTRO}/${IMAGEN}:sha-${GITHUB_SHA}"

          # En ACI, cambiar la imagen es volver a crear el grupo de contenedores: si ya existe se borra primero. La
          # etiqueta DNS se conserva, asi que la URL no cambia aunque la IP si.
          if az container show --name "$CONTENEDOR" --resource-group "$GRUPO_RECURSOS" --only-show-errors > /dev/null 2>&1; then
            echo "El contenedor $CONTENEDOR ya existe: lo reemplazo"
            az container delete --name "$CONTENEDOR" --resource-group "$GRUPO_RECURSOS" --yes --only-show-errors > /dev/null
          fi
          echo "Creo el contenedor $CONTENEDOR con $imagen_completa (${CPU} vCPU, ${MEMORIA} GB)"
          az container create --name "$CONTENEDOR" --resource-group "$GRUPO_RECURSOS" \
            --image "$imagen_completa" --os-type Linux --cpu "$CPU" --memory "$MEMORIA" \
            --registry-login-server "$REGISTRO" --registry-username "$ACR_USUARIO" --registry-password "$ACR_PASSWORD" \
            --ports 8080 --ip-address Public --dns-name-label "$ETIQUETA_DNS" --restart-policy Always \
            --environment-variables HTTP_ADDR=:8080 "CARGAR_DATOS_EJEMPLO=${CARGAR_DATOS_EJEMPLO}" \
            --secure-environment-variables "DATABASE_URL=${DATABASE_URL}" --only-show-errors > /dev/null

      # ACI no hace TLS: la app se ve por http en el puerto 8080. Bajar la imagen y arrancar tarda un par de minutos.
      - name: Comprobar que responde (/health)
        run: |
          set -euo pipefail
          fqdn=$(az container show --name "$CONTENEDOR" --resource-group "$GRUPO_RECURSOS" \
            --query ipAddress.fqdn --output tsv --only-show-errors)
          url="http://${fqdn}:8080"
          for intento in $(seq 1 24); do
            codigo=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 20 "${url}/health" || true)
            echo "Intento ${intento} de 24: HTTP ${codigo}"
            if [ "$codigo" = "200" ]; then
              {
                echo "### Despliegue"
                echo ""
                echo "- contenedor: \`${CONTENEDOR}\` (${CPU} vCPU, ${MEMORIA} GB)"
                echo "- imagen: \`${REGISTRO}/${IMAGEN}:sha-${GITHUB_SHA}\`"
                echo "- URL: ${url}"
                echo "- \`/health\`: HTTP 200"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error::La app no respondio 200 en /health despues de 24 intentos."
          az container logs --name "$CONTENEDOR" --resource-group "$GRUPO_RECURSOS" --only-show-errors | tail -n 50 || true
          exit 1

      # ACI cobra mientras el contenedor esta encendido. Se apaga aunque la comprobacion haya fallado, salvo que se
      # haya pedido mantenerlo (MANTENER_ENCENDIDO=true). Para encenderlo de nuevo: workflow "ACI: encender o apagar".
      - name: Apagar el contenedor (no gastar creditos)
        if: always() && env.MANTENER_ENCENDIDO != 'true'
        continue-on-error: true
        run: |
          az container stop --name "$CONTENEDOR" --resource-group "$GRUPO_RECURSOS" --only-show-errors > /dev/null
          {
            echo ""
            echo "Contenedor **apagado** para no gastar creditos (\`MANTENER_ENCENDIDO\` no vale true). Se enciende con el workflow \"ACI: encender o apagar\"."
          } >> "$GITHUB_STEP_SUMMARY"
