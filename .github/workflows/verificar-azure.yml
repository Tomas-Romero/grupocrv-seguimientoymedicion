name: Verificar Azure (solo lectura)

# Diagnostico a mano (Actions > Verificar Azure > Run workflow) para correr ANTES del primer despliegue y
# cada vez que se cambie una credencial. No crea, cambia ni borra nada en Azure, no publica ninguna imagen y
# no despliega: solo lee. Comprueba, con las credenciales y variables reales del Environment "azure":
#   - que esten los secretos y las variables (dice si estan, nunca sus valores);
#   - que el nombre del contenedor y la etiqueta DNS cumplan los limites de Azure Container Instances (ACI);
#   - que la base de datos (DATABASE_URL) acepte la conexion con nuestro driver;
#   - que el service principal pueda entrar a Azure y ver el grupo de recursos y el contenedor (si ya existe), si el
#     proveedor de ACI esta registrado y con que roles cuenta;
#   - que la clave del registro (ACR_PASSWORD) funcione y que etiquetas de la imagen del grupo hay.
# El resumen de la ejecucion deja una tabla con cada comprobacion. Como lee el Environment azure, solo corre
# desde main.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-azure
  cancel-in-progress: false

jobs:
  verificar:
    name: Verificar la configuracion
    runs-on: ubuntu-latest
    environment: azure
    env:
      ACR_NAME: ${{ vars.ACR_NAME || 'ingcalidad2026' }}
      REGISTRO: ${{ vars.ACR_URL || format('{0}.azurecr.io', vars.ACR_NAME || 'ingcalidad2026') }}
      ACR_USUARIO: ${{ vars.ACR_USERNAME || vars.ACR_NAME || 'ingcalidad2026' }}
      IMAGEN: ${{ vars.IMAGE_NAME || 'grupo03-grupocrv' }}
      GRUPO_RECURSOS: ${{ vars.RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP || 'frsrutn' }}
      CONTENEDOR: ${{ vars.CONTAINER_APP_NAME || vars.ACI_NAME || 'grupo03-grupocrv-seguimientoymedicion' }}
      ACI_REGION: ${{ vars.ACI_REGION || '' }}
      ETIQUETA_DNS: ${{ vars.ACI_DNS_LABEL || vars.CONTAINER_APP_NAME || vars.ACI_NAME || 'grupo03-grupocrv-seguimientoymedicion' }}
      # Solo se pasa si el secreto existe, nunca su valor.
      TIENE_CREDENCIALES: ${{ secrets.AZURE_CREDENTIALS != '' }}
      TIENE_BASE: ${{ secrets.DATABASE_URL != '' }}
      TIENE_CLAVE_ACR: ${{ secrets.ACR_PASSWORD != '' }}
      CD_ACTIVO: ${{ vars.CD_ACTIVO || 'false' }}
      MANTENER_ENCENDIDO: ${{ vars.MANTENER_ENCENDIDO || 'false' }}
    steps:
      - name: Revisar secretos, variables y nombres
        id: datos
        run: |
          set -uo pipefail
          falta=0
          {
            echo "### Verificacion de Azure (solo lectura)"
            echo ""
            echo "| Comprobacion | Resultado |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          fila() { echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"; }

          for par in "AZURE_CREDENTIALS:$TIENE_CREDENCIALES" "DATABASE_URL:$TIENE_BASE" "ACR_PASSWORD:$TIENE_CLAVE_ACR"; do
            nombre=${par%%:*}
            if [ "${par#*:}" = "true" ]; then
              fila "Secreto \`$nombre\`" "esta cargado"
            else
              fila "Secreto \`$nombre\`" "**FALTA**"
              falta=1
            fi
          done

          fila "Registro" "\`$REGISTRO\` (usuario \`$ACR_USUARIO\`)"
          fila "Grupo de recursos" "\`$GRUPO_RECURSOS\`"
          fila "Imagen" "\`$IMAGEN\`"
          if [ "$CD_ACTIVO" = "true" ]; then
            fila "Despliegue automatico (\`CD_ACTIVO\`)" "**ENCENDIDO**: cada merge a main que cambie la imagen publica y despliega"
          else
            fila "Despliegue automatico (\`CD_ACTIVO\`)" "apagado (solo se valida el Dockerfile)"
          fi
          if [ "$MANTENER_ENCENDIDO" = "true" ]; then
            fila "Contenedor despues de desplegar (\`MANTENER_ENCENDIDO\`)" "**se mantiene ENCENDIDO** (cobra por segundo mientras tanto)"
          else
            fila "Contenedor despues de desplegar (\`MANTENER_ENCENDIDO\`)" "se apaga solo (y se apaga cada noche si quedo encendido)"
          fi

          case "$CONTENEDOR" in
            grupo03-*) ;;
            *) fila "Nombre del contenedor" "**\`$CONTENEDOR\` no empieza con grupo03-**"; falta=1 ;;
          esac
          if [ "${#CONTENEDOR}" -gt 63 ] || ! [[ "$CONTENEDOR" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            fila "Nombre del contenedor" "**\`$CONTENEDOR\` (${#CONTENEDOR} caracteres) no es valido en ACI: maximo 63, minusculas, numeros y guiones**"
            falta=1
          else
            fila "Nombre del contenedor" "\`$CONTENEDOR\` (${#CONTENEDOR} caracteres, valido en ACI)"
          fi
          if [ "${#ETIQUETA_DNS}" -lt 5 ] || [ "${#ETIQUETA_DNS}" -gt 63 ] || ! [[ "$ETIQUETA_DNS" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]]; then
            fila "Etiqueta DNS" "**\`$ETIQUETA_DNS\` no es valida: de 5 a 63 caracteres, minusculas, numeros y guiones**"
            falta=1
          else
            fila "Etiqueta DNS" "\`$ETIQUETA_DNS\` (la URL sera http://$ETIQUETA_DNS.REGION.azurecontainer.io:8080)"
          fi
          echo "falta=$falta" >> "$GITHUB_OUTPUT"

      # La base de Neon: el mismo motor y el mismo formato que usa la app al arrancar.
      - name: Probar la base de datos (DATABASE_URL)
        id: base
        if: env.TIENE_BASE == 'true'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGCONNECT_TIMEOUT: "40"
        run: |
          set -uo pipefail
          fila() { echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"; }
          if [[ "$DATABASE_URL" == *channel_binding* ]]; then
            fila "Base de datos: formato" "**la cadena tiene channel_binding: hay que quitarlo (la app no arranca con el)**"
            exit 1
          fi
          if [[ "$DATABASE_URL" != *sslmode=* ]]; then
            fila "Base de datos: formato" "**falta sslmode=require**"
            exit 1
          fi
          if [[ "$DATABASE_URL" == *-pooler* ]]; then
            fila "Base de datos: formato" "usa el host con pooler: conviene la conexion directa (sin -pooler)"
          else
            fila "Base de datos: formato" "sin channel_binding, con sslmode, conexion directa"
          fi
          if version=$(psql "$DATABASE_URL" --tuples-only --no-align --command "select version()" 2>&1); then
            fila "Base de datos: conexion" "responde (${version%%,*})"
          else
            fila "Base de datos: conexion" "**no responde** (${version//$'\n'/ })"
            exit 1
          fi

      # El formato se revisa ANTES de loguearse: con un tenantId mal cargado, Azure devuelve el valor completo en su mensaje de error
      # y el log (que lo ve cualquiera con acceso al repositorio) mostraria la clave. Aca solo se escribe el nombre del campo.
      - name: Revisar el formato de AZURE_CREDENTIALS
        id: credenciales
        if: env.TIENE_CREDENCIALES == 'true'
        continue-on-error: true
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: |
          set -uo pipefail
          fila() { echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"; }
          campo() { jq -r --arg campo "$1" '.[$campo] | if type == "string" then . else "" end' 2> /dev/null <<< "$AZURE_CREDENTIALS"; }
          if ! jq -e 'type == "object"' > /dev/null 2>&1 <<< "$AZURE_CREDENTIALS"; then
            fila "Credenciales de Azure: formato" "**el secreto no es un JSON**: volve a cargarlo con \`bash scripts/configurar-azure.sh --solo-credenciales\`"
            exit 1
          fi
          mal=""
          for nombre in clientId subscriptionId tenantId; do
            [[ "$(campo "$nombre")" =~ ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$ ]] || mal="$mal \`$nombre\`"
          done
          secreto=$(campo clientSecret)
          # La clave no puede estar vacia ni tener espacios, llaves o comillas (es señal de que se pego el JSON entero).
          if [ -z "$secreto" ]; then
            mal="$mal \`clientSecret\`"
          else
            case "$secreto" in
              *[[:space:]]* | *"{"* | *"}"* | *'"'*) mal="$mal \`clientSecret\`" ;;
            esac
          fi
          if [ -n "$mal" ]; then
            fila "Credenciales de Azure: formato" "**estos campos no tienen el formato correcto:**$mal (cada uno lleva solo su valor; volve a cargarlas con \`bash scripts/configurar-azure.sh --solo-credenciales\`). No se intento el login."
            exit 1
          fi
          fila "Credenciales de Azure: formato" "los tres identificadores son GUID y hay clave"

      # azure/login v3.1.0
      - name: Login en Azure
        id: login
        if: env.TIENE_CREDENCIALES == 'true' && steps.credenciales.outcome == 'success'
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Cada comprobacion de Azure es independiente: una que falla no corta a las demas.
      - name: Leer lo que existe en Azure
        id: azure
        if: steps.login.outcome == 'success'
        continue-on-error: true
        run: |
          set -uo pipefail
          fila() { echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"; }
          jsonc() { az "$@" --output json --only-show-errors | jq -c .; }
          comprobar() { # $1 descripcion, $2 ... comando; la salida (una linea) va a la tabla
            local descripcion=$1 salida
            shift
            if salida=$("$@" 2>&1); then
              fila "$descripcion" "${salida//$'\n'/ }"
            else
              fila "$descripcion" "**no se pudo:** ${salida//$'\n'/ }"
              return 1
            fi
          }
          fallas=0

          comprobar "Cuenta de Azure" jsonc account show --query "{suscripcion:name, estado:state}" || fallas=$((fallas + 1))
          comprobar "Grupo de recursos \`$GRUPO_RECURSOS\`" jsonc group show --name "$GRUPO_RECURSOS" --query "{region:location, estado:properties.provisioningState}" || fallas=$((fallas + 1))
          comprobar "Proveedor Microsoft.ContainerInstance (ACI)" az provider show --namespace Microsoft.ContainerInstance --query registrationState --output tsv --only-show-errors \
            || fila "Proveedor Microsoft.ContainerInstance (ACI)" "no se pudo leer (el service principal puede no tener permiso; si no esta Registered, ACI no funciona)"

          # La region donde se crea el contenedor: la de ACI_REGION o, si no esta, la del grupo de recursos. La politica de la
          # suscripcion puede no permitirla (RequestDisallowedByAzure); estas filas dicen donde ACI funciona y que permite la politica.
          fila "Region de ACI (\`ACI_REGION\`)" "${ACI_REGION:-sin definir: se usa la region del grupo de recursos}"
          comprobar "Regiones donde ACI crea contenedores" az provider show --namespace Microsoft.ContainerInstance \
            --query "resourceTypes[?resourceType=='containerGroups'].locations | [0]" --output tsv --only-show-errors \
            || fila "Regiones donde ACI crea contenedores" "no se pudo leer"
          if permitidas=$(az policy assignment list --query "[?parameters.listOfAllowedLocations].parameters.listOfAllowedLocations.value | [0]" --output tsv --only-show-errors 2>&1) && [ -n "$permitidas" ]; then
            fila "Regiones que permite la politica de la suscripcion" "${permitidas//$'\n'/ ; }"
          else
            fila "Regiones que permite la politica de la suscripcion" "no se pudieron leer (sin permiso, o la politica no usa esa lista)"
          fi

          if az container show --name "$CONTENEDOR" --resource-group "$GRUPO_RECURSOS" --only-show-errors > /dev/null 2>&1; then
            comprobar "Contenedor \`$CONTENEDOR\`" jsonc container show --name "$CONTENEDOR" --resource-group "$GRUPO_RECURSOS" \
              --query "{estado:instanceView.state, cpu:containers[0].resources.requests.cpu, memoriaGb:containers[0].resources.requests.memoryInGb, url:ipAddress.fqdn, reinicio:restartPolicy}" \
              || fallas=$((fallas + 1))
          else
            fila "Contenedor \`$CONTENEDOR\`" "todavia no existe (el primer despliegue lo crea)"
          fi
          comprobar "Contenedores del grupo (grupo03-*) en el grupo de recursos" az container list --resource-group "$GRUPO_RECURSOS" \
            --query "[?starts_with(name, 'grupo03-')].name" --output tsv --only-show-errors || fallas=$((fallas + 1))

          comprobar "Registro \`$ACR_NAME\`" jsonc acr show --name "$ACR_NAME" --query "{plan:sku.name, usuarioAdmin:adminUserEnabled}" \
            || fila "Registro \`$ACR_NAME\`" "el service principal no puede leerlo (no es grave si ACR_PASSWORD funciona)"

          # Los roles del service principal, sin mostrar el identificador de la suscripcion.
          if sp=$(az account show --query user.name --output tsv --only-show-errors 2> /dev/null) && [ -n "$sp" ]; then
            if roles=$(az role assignment list --assignee "$sp" --all --query "[].join(' en ', [roleDefinitionName, split(scope, '/')[-1]])" --output tsv --only-show-errors 2>&1); then
              fila "Roles del service principal" "${roles//$'\n'/ ; }"
            else
              fila "Roles del service principal" "no se pudieron leer (el service principal no puede listar roles)"
            fi
          fi
          echo "fallas=$fallas"
          [ "$fallas" -eq 0 ]

      - name: Probar el registro (ACR_PASSWORD) y ver las etiquetas del grupo
        id: registro
        if: env.TIENE_CLAVE_ACR == 'true'
        continue-on-error: true
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -uo pipefail
          fila() { echo "| $1 | $2 |" >> "$GITHUB_STEP_SUMMARY"; }
          if printf '%s' "$ACR_PASSWORD" | docker login "$REGISTRO" --username "$ACR_USUARIO" --password-stdin > /dev/null 2>&1; then
            fila "Registro: usuario y clave (ACR_PASSWORD)" "el login funciona (es lo que usa ACI para bajar la imagen)"
          else
            fila "Registro: usuario y clave (ACR_PASSWORD)" "**el login falla** (usuario \`$ACR_USUARIO\`): revisar ACR_USERNAME y la clave"
            exit 1
          fi
          if etiquetas=$(az acr repository show-tags --name "$ACR_NAME" --repository "$IMAGEN" --username "$ACR_USUARIO" --password "$ACR_PASSWORD" --output tsv 2>&1); then
            cantidad=$(printf '%s\n' "$etiquetas" | grep -c '^sha-' || true)
            fila "Imagen \`$IMAGEN\` en el registro" "$cantidad etiquetas sha-* (todavia no hay imagen si es 0)"
          else
            fila "Imagen \`$IMAGEN\` en el registro" "todavia no hay un repositorio con ese nombre (lo crea la primera publicacion)"
          fi

      - name: Resultado
        if: always()
        env:
          FALTA: ${{ steps.datos.outputs.falta }}
          BASE: ${{ steps.base.outcome }}
          CREDENCIALES: ${{ steps.credenciales.outcome }}
          LOGIN: ${{ steps.login.outcome }}
          AZURE: ${{ steps.azure.outcome }}
          REGISTRO_CLAVE: ${{ steps.registro.outcome }}
        run: |
          bien=1
          [ "$FALTA" = "0" ] || bien=0
          for resultado in "$BASE" "$CREDENCIALES" "$LOGIN" "$AZURE" "$REGISTRO_CLAVE"; do
            [ "$resultado" != "failure" ] || bien=0
          done
          {
            echo ""
            if [ "$bien" = "1" ]; then
              echo "Todo lo que se pudo comprobar esta bien. Esta comprobacion no cambio nada en Azure ni gasto creditos."
            else
              echo "**Hay algo para corregir antes de desplegar** (ver las filas marcadas)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$bien" = "1" ]
