# Uso normal (desarrollo): docker compose up -d      -> solo la base
# Uso del evaluador:       docker compose --profile full up  -> base + app
services:
  db:
    image: postgres:16-alpine
    container_name: metrics-db
    environment:
      POSTGRES_USER: metrics
      POSTGRES_PASSWORD: metrics
      POSTGRES_DB: metrics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrics -d metrics"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metrics-app
    environment:
      DATABASE_URL: postgres://metrics:metrics@db:5432/metrics?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
